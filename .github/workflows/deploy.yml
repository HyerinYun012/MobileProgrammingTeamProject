name: Java CI/CD with Gradle

on:
  push:
    branches: [ "SDA" ] # SDA 브랜치에 푸시될 때 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 17 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Secrets에 저장된 환경 변수로 application.yml 생성
      - name: Create application.yml
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" > src/main/resources/application.yml

      # 빌드 진행 (테스트 제외)
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      # JAR 파일을 EC2로 전송 (버전 고정 반영)
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "build/libs/petplace-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/MobileProgrammingTeamProject/build/libs"
          strip_components: 2

      # EC2에서 서버 재기동 (버전 고정 및 로그 확인 코드 추가)
      - name: Execute Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 8080 포트를 점유 중인 기존 프로세스 종료
            fuser -k 8080/tcp || true
            
            # 신규 JAR 백그라운드 실행
            nohup java -jar /home/ubuntu/MobileProgrammingTeamProject/build/libs/petplace-0.0.1-SNAPSHOT.jar > /home/ubuntu/nohup.out 2>&1 &